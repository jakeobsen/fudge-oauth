name: Release

# A pushed v* tag publishes the image to ghcr.io/jakeobsen/fudge-oauth: tagged with its version (v1.2.3 → 1.2.3),
# and as latest unless it's a pre-release (v1.2.3-rc.1).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: The tag is v and a semantic version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # vMAJOR.MINOR.PATCH with an optional pre-release; no build metadata, since an image tag can't hold "+".
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$id(\.$id)*)?$"
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::$TAG isn't v followed by a semantic version, such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

  test:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
          check-latest: true

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The image index carries the annotations too, so ghcr.io shows the description for the multi-arch image.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/jakeobsen/fudge-oauth
          # latest=auto adds latest for a release, never for a pre-release.
          flavor: latest=auto
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=fudge-oauth
            org.opencontainers.image.description=The OAuth sign-in relay for Fudge, the Raycast-compatible launcher for macOS.
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          annotations: |
            org.opencontainers.image.title=fudge-oauth
            org.opencontainers.image.description=The OAuth sign-in relay for Fudge, the Raycast-compatible launcher for macOS.
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build the amd64 image to test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fudge-oauth:release

      - name: Smoke-test it
        run: |
          key="$(openssl rand -base64 32)"
          docker run -d --name relay -p 127.0.0.1:8080:8080 \
            -e FUDGE_OAUTH_PUBLIC_URL=https://oauth.example.com \
            -e FUDGE_OAUTH_KEY="$key" \
            -e FUDGE_OAUTH_GITHUB_CLIENT_ID=release \
            -e FUDGE_OAUTH_GITHUB_CLIENT_SECRET=release \
            fudge-oauth:release
          for _ in $(seq 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q 'https://oauth.example.com/github/callback'
          docker exec relay /fudge-oauth healthcheck
          docker logs relay

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
